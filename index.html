<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Live text chat for whatever you're watching. Open it, get a ridiculous tag, and talk trash with everyone watching the same thing at the same time.">
  <meta name="theme-color" content="#000000">

  <!-- How the link looks when someone shares it -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Schitchat">
  <meta property="og:title" content="Schitchat">
  <meta property="og:description" content="Live text chat for whatever you're watching. Get a ridiculous tag and talk trash in real time.">
  <meta property="og:url" content="https://schitchat.com/">
  <meta property="og:image" content="https://schitchat.com/logo_full.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Schitchat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Schitchat</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#000;margin:0">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
