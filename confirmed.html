<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — Schitchat</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #000; color: #fff;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 460px; background: #121212; border: 1px solid #242424;
    border-radius: 18px; padding: 40px 28px; text-align: center;
  }
  img.mark { width: 170px; max-width: 65%; height: auto; margin-bottom: 26px; }
  .tick {
    width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 50%;
    background: #FFC93C; display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #000; font-weight: 900;
  }
  h1 { margin: 0 0 10px; font-size: 25px; font-weight: 800; letter-spacing: -0.3px; }
  p  { margin: 0 0 26px; color: #8A8A8E; }
  a.btn {
    display: block; padding: 15px 20px; border-radius: 12px; text-decoration: none;
    font-weight: 800; font-size: 16px; background: #FFC93C; color: #000;
  }
  a.ghost {
    display: block; margin-top: 10px; padding: 13px 20px; border-radius: 12px;
    border: 1px solid #242424; color: #fff; text-decoration: none;
    font-weight: 600; font-size: 14px;
  }
  footer { margin-top: 26px; color: #5A5A5E; font-size: 11.5px; line-height: 1.7; }
  footer a { color: #5A5A5E; }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="wordmark.png" alt="Schitchat">
    <div class="tick">&check;</div>
    <h1>Email confirmed</h1>
    <p>You're good to chat. Your tag is yours to keep.</p>

    <!-- Tries the installed app first. If the app isn't there the custom
         scheme silently does nothing, which is why the web link sits right
         underneath rather than behind a redirect that might strand someone. -->
    <a class="btn" id="open" href="schitchat://confirmed">Open the app</a>
    <a class="ghost" href="https://schitchat.com/">Keep going on the web</a>

    <footer>
      <a href="privacy.html">Privacy</a> ·
      <a href="terms.html">Terms</a> ·
      <a href="mailto:what@schitchat.com">what@schitchat.com</a><br>
      Schitchat, Inc.
    </footer>
  </div>

  <script>
    // On a phone, try to hand off to the app straight away. Desktop browsers
    // get nothing useful from a custom scheme, so don't bother them with it.
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      setTimeout(function () { window.location = 'schitchat://confirmed'; }, 350);
    }
  </script>
</body>
</html>
